name: Update Persib XML data

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled workflows during load.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persib-data-update
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape and validate Flashscore
        env:
          TEAM_NAME: Persib Bandung
          TEAM_ID: KpBjbPK1
          FLASHSCORE_BASE_URL: https://www.flashscore.com
          FLASHSCORE_TEAM_URL: https://www.flashscore.com/team/persib-bandung/KpBjbPK1/
          FLASHSCORE_FIXTURES_URL: https://www.flashscore.com/team/persib-bandung/KpBjbPK1/fixtures/
          FLASHSCORE_RESULTS_URL: https://www.flashscore.com/team/persib-bandung/KpBjbPK1/results/
          SEASON_START: '2026-07-01'
          TIMEZONE: Asia/Jakarta
          MAX_PAGES: '30'
          DETAIL_DELAY_MS: '1200'
          PAGE_DELAY_MS: '1200'
          HEADLESS: 'true'
        run: python scraper.py

      - name: Collect scraper diagnostics
        if: always()
        run: |
          mkdir -p debug
          echo "Workflow diagnostic timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > debug/workflow.txt
          echo "Repository: $GITHUB_REPOSITORY" >> debug/workflow.txt
          echo "Run: $GITHUB_RUN_ID" >> debug/workflow.txt
          if [ -f data/last-update.xml ]; then
            echo '--- last-update.xml ---' >> debug/workflow.txt
            cat data/last-update.xml >> debug/workflow.txt
          fi
          echo '--- debug directory ---' >> debug/workflow.txt
          find debug -maxdepth 1 -type f -printf '%f\n' | sort >> debug/workflow.txt

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persib-scraper-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Show generated XML summary
        if: always()
        run: |
          echo '--- fixtures.xml ---'
          grep -c '<match>' data/fixtures.xml || true
          echo '--- results.xml ---'
          grep -c '<match>' data/results.xml || true
          echo '--- last-update.xml ---'
          cat data/last-update.xml 2>/dev/null || true

      - name: Commit changed XML files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.xml data/results.xml data/last-update.xml
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m "chore(data): update Persib fixtures and results"
          git push
